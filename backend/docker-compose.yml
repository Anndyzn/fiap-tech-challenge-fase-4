services:
  postgres:
    image: postgres:16
    container_name: postgres_blog_fiap_f4
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_fiap_f4
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET nao configurado}

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/migrations:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog_fiap_f4"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: api_blog_fiap_f4
    restart: always

    ports:
      - "4001:4000"

    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: blog_fiap_f4

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: